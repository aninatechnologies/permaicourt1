<!DOCTYPE html>

<html lang="ms">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#2b6cee",
                "background-light": "#f6f6f8",
                "background-dark": "#101622",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-auto min-h-screen w-full max-w-[480px] mx-auto flex-col bg-white dark:bg-background-dark overflow-x-hidden shadow-sm" style="--select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(97,111,137)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');">
<!-- Header -->
<header class="flex items-center bg-white dark:bg-background-dark p-4 pb-4 sticky top-0 z-10 border-b border-slate-100 dark:border-slate-800">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Borang Maklumat</h2>
</header>
<!-- Form Content -->
<main class="flex-1 px-4 py-6 space-y-6">
<div class="space-y-1">
<h3 class="text-xl font-bold text-slate-900 dark:text-slate-100">Maklumat Peribadi</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">Sila lengkapkan butiran di bawah untuk rujukan pengurusan Permai Court 1.</p>
</div>
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal">Nama Penuh
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary h-14 placeholder:text-slate-400 p-[15px] text-base font-normal" placeholder="Masukkan nama penuh anda" type="text"/>
</label></div>
<!-- Unit Number -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal">No. Unit
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary h-14 placeholder:text-slate-400 p-[15px] text-base font-normal" placeholder="Contoh: A-10-1" type="text"/>
</label></div>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal">No. Telefon
<div class="relative">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary h-14 placeholder:text-slate-400 p-[15px] text-base font-normal" placeholder="Contoh: 0123456789" type="tel"/>
</div>
</label></div>
<!-- Category -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal">Kategori
<div class="relative">
<select class="form-select appearance-none flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary h-14 bg-[image:--select-button-svg] bg-[position:right_15px_center] bg-no-repeat placeholder:text-slate-400 p-[15px] text-base font-normal">
<option disabled="" selected="" value="">Pilih kategori</option>
<option value="adu">Aduan Kerosakan</option>
<option value="mak">Maklum Balas</option>
<option value="ren">Renovasi</option>
<option value="lai">Lain-lain</option>
</select>
</div>
</label></div>
<!-- Description/Notes -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal">Keterangan / Catatan
<textarea class="form-textarea flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary placeholder:text-slate-400 p-[15px] text-base font-normal resize-none" placeholder="Sila nyatakan butiran lanjut di sini..." rows="4"></textarea>
</label></div>
</main>
<!-- Action Buttons -->
<footer class="p-4 bg-white dark:bg-background-dark flex flex-col gap-3 pb-8">
<button id="butangTabBaharu" class="w-full bg-primary text-white font-bold h-14 rounded-xl shadow-md hover:bg-primary/90 transition-colors active:scale-[0.98]">
                Hantar
            </button>
<button class="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold h-14 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors active:scale-[0.98]">
                Batal
            </button>
</footer>
<!-- Bottom Spacer for iOS Notch/Home Indicator -->
<div class="h-4"></div>
</div>

<script>
  // Pilih butang menggunakan ID
  const butang1 = document.getElementById('butangTabBaharu');

  
  // Tambah fungsi apabila butang diklik
  butang1.addEventListener('click', function() {
    window.location.href = '9.html';
  });  
</script>

</body>
</html>
