<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">

<img src="img/jmb1.png" width="50%">
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">Permai Court 1</h1>
<p class="text-slate-500 dark:text-slate-400 font-medium">Ampang Jaya, Selangor</p>
</div>

<form class="space-y-5" onsubmit="return false;">

</div>

</div>

<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>

<a class="text-sm font-medium text-primary hover:underline" href="1.html">Lupa Kata Laluan?</a>

<button id="butangTabBaharu" class="w-full bg-primary hover:bg-blue-600 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                    Log Masuk
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>

<!-- Ikon Terapung PWA -->

<button id="btnPasang"
style="
 display: none;
 position: fixed;
 bottom: 22px;
 right: 22px;
 z-index: 9999;
 background: transparent;
 color: #1a5276;
 width: 52px;
 height: 60px;
 padding: 0;
 border: none;
 border-radius: 0;
 box-shadow: none;
 align-items: center;
 justify-content: center;
 cursor: pointer;
 transition: transform 0.2s ease, filter 0.2s ease;
"
onmouseover="
 this.style.transform='scale(1.12)';
 this.style.filter='drop-shadow(0 4px 6px rgba(0,0,0,0.25))';
"
onmouseout="
 this.style.transform='scale(1)';
 this.style.filter='none';
"
title="Pasang Aplikasi">

<span
 class="material-symbols-outlined"
 style="
   font-size: 46px;
   font-weight: 500;
   line-height: 1;
 ">
install_mobile </span>

</button>


        
<div class="mt-12 mb-8 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Belum mempunyai akaun? 
                  
</p>
</div>
</div>
<div class="mt-auto pb-10 px-8 text-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-full">
<span class="material-symbols-outlined text-sm text-slate-500">support_agent</span>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400"><a href="1.html">Hubungi Pengurusan</a></span>
</div>
</div>
</div>
        
<script>
  // Pilih butang menggunakan ID
  const butang1 = document.getElementById('butangTabBaharu');

  
  // Tambah fungsi apabila butang diklik
  butang1.addEventListener('click', function() {
    window.location.href = '1.html';
  });  
        
  let deferredPrompt;
  const btnPasang = document.getElementById('btnPasang');

  // 1. Daftar Service Worker dengan laluan repo yang betul
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/permaicourt1/service-worker.js')
        .then(reg => console.log('Service Worker aktif'))
        .catch(err => console.log('Gagal:', err));
    });
  }

  // 2. Tangkap event sedia untuk dipasang dari pelayar
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); // Halang prompt automatik biasa
    deferredPrompt = e;  // Simpan event untuk digunakan nanti
    btnPasang.style.display = 'block'; // Paparkan butang pasang manual anda

    btnPasang.addEventListener('click', () => {
      btnPasang.style.display = 'none'; // Sorokkan butang selepas ditekan
      deferredPrompt.prompt(); // Paparkan prompt pasang rasmi pelayar
      
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Pengguna bersetuju memasang PWA');
        }
        deferredPrompt = null;
      });
    });
  });
        
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/permaicourt1/service-worker.js')
        .then(reg => console.log('Service Worker terdaftar di skop:', reg.scope))
        .catch(err => console.log('Pendaftaran Service Worker gagal:', err));
    });
  }        
        
</script>

</body>
</html>
