<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Permai Court 1</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Google Font: Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
        rel="stylesheet"
    >

    <!-- PWA Manifest -->
    <link rel="manifest" href="/permaicourt1/manifest.json">

    <style>
        :root {
            --primary: #137fec;
            --background-light: #ffffff;
            --background-dark: #0f172a;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: max(884px, 100dvh);
            margin: 0;
            background-color: var(--background-light);
            font-family: "Inter", sans-serif;
            color: #0f172a;
        }

        /* Material Symbols */
        .material-symbols-outlined {
            font-family: "Material Symbols Outlined";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        /* Main Mobile Container */
        .login-container {
            position: relative;
            width: 100%;
            max-width: 448px;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: #ffffff;
            overflow-x: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

            display: flex;
            flex-direction: column;
        }

        /* Header */
        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 64px 32px 40px;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .logo-wrapper img {
            width: 100%;
            max-width: 180px;
            height: auto;
            display: block;
        }

        .property-title {
            font-size: 24px;
            line-height: 1.2;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 4px;
        }

        .property-location {
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }

        /* Main Content */
        .login-content {
            flex: 1;
            padding: 0 32px;
        }

        .login-heading {
            margin-bottom: 32px;
        }

        .login-heading h2 {
            font-size: 20px;
            line-height: 1.3;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-heading p {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin: 0;
        }

        /* Form */
        .form-group-custom {
            margin-bottom: 20px;
        }

        .form-label-custom {
            display: block;
            margin-left: 4px;
            margin-bottom: 8px;

            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;

            color: #64748b;
        }

        /* Input Wrapper */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);

            color: #94a3b8;
            pointer-events: none;
            z-index: 3;

            transition: color 0.2s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        /* Input */
        .custom-input {
            width: 100%;
            min-height: 58px;

            padding: 16px 16px 16px 44px;

            background-color: #f8fafc;
            border: 0;

            border-radius: 12px;

            color: #0f172a;
            font-family: "Inter", sans-serif;
            font-size: 16px;

            box-shadow:
                0 2px 8px -2px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px #e2e8f0;

            outline: none;

            transition:
                box-shadow 0.2s ease,
                background-color 0.2s ease;
        }

        .custom-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .custom-input:focus {
            background-color: #ffffff;
            border: 0;

            box-shadow:
                0 2px 8px -2px rgba(0, 0, 0, 0.05),
                0 0 0 2px var(--primary);
        }

        /* Password Input */
        .password-input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 16px;

            transform: translateY(-50%);

            border: 0;
            padding: 0;

            background: transparent;
            color: #94a3b8;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #475569;
        }

        /* Forgot Password */
        .forgot-password-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: -4px;
            margin-bottom: 0;
        }

        .forgot-password {
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            min-height: 58px;

            margin-top: 16px;

            border: 0;
            border-radius: 12px;

            background-color: var(--primary);
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;
            font-family: "Inter", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            box-shadow:
                0 10px 20px rgba(19, 127, 236, 0.20);

            transition:
                background-color 0.2s ease,
                transform 0.1s ease,
                box-shadow 0.2s ease;
        }

        .btn-login:hover {
            background-color: #0d6fd1;
            color: #ffffff;
            box-shadow:
                0 12px 24px rgba(19, 127, 236, 0.25);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login .material-symbols-outlined {
            font-size: 22px;
        }

        /* Register Area */
        .register-area {
            margin-top: 48px;
            margin-bottom: 32px;

            text-align: center;
        }

        .register-area p {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        /* Footer */
        .login-footer {
            margin-top: auto;
            padding: 0 32px 40px;

            text-align: center;
        }

        .support-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 16px;

            background-color: #f1f5f9;

            border-radius: 999px;
        }

        .support-pill .material-symbols-outlined {
            font-size: 16px;
            color: #64748b;
        }

        .support-pill a {
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
        }

        .support-pill a:hover {
            text-decoration: underline;
        }

        /* ==========================================
           DARK MODE
        ========================================== */

        @media (prefers-color-scheme: dark) {

            body {
                background-color: var(--background-dark);
                color: #f1f5f9;
            }

            .login-container {
                background-color: #0f172a;
            }

            .property-title {
                color: #ffffff;
            }

            .property-location {
                color: #94a3b8;
            }

            .login-heading h2 {
                color: #f1f5f9;
            }

            .login-heading p {
                color: #94a3b8;
            }

            .form-label-custom {
                color: #94a3b8;
            }

            .custom-input {
                background-color: #1e293b;
                color: #ffffff;

                box-shadow:
                    0 2px 8px -2px rgba(0, 0, 0, 0.15),
                    inset 0 0 0 1px #334155;
            }

            .custom-input::placeholder {
                color: #64748b;
            }

            .custom-input:focus {
                background-color: #1e293b;
            }

            .password-toggle:hover {
                color: #cbd5e1;
            }

            .register-area p {
                color: #94a3b8;
            }

            .support-pill {
                background-color: #1e293b;
            }

            .support-pill .material-symbols-outlined,
            .support-pill a {
                color: #94a3b8;
            }
        }

        /* Desktop */
        @media (min-width: 576px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px 0;
            }

            .login-container {
                min-height: calc(100vh - 40px);
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- ==========================================
         HEADER
    =========================================== -->
    <header class="login-header">

        <div class="logo-wrapper">
            <img
                src="img/jmb1.png"
                alt="Logo Permai Court 1"
            >
        </div>

        <h1 class="property-title">
            Permai Court 1
        </h1>

        <p class="property-location">
            Ampang Jaya, Selangor
        </p>

    </header>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->
    <main class="login-content">

        <div class="login-heading">

            <h2>
                Log Masuk Penghuni
            </h2>

            <p>
                Sila masukkan butiran anda untuk bermula
            </p>

        </div>


        <!-- LOGIN FORM -->
        <form id="loginForm">

            <!-- NO HP / EMEL -->
            <div class="form-group-custom">

                <label
                    for="loginInput"
                    class="form-label-custom"
                >
                    No. HP / Emel
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-outlined input-icon">
                        call
                    </span>

                    <input
                        id="loginInput"
                        type="text"
                        class="custom-input"
                        placeholder="Contoh: 0112345678 atau emel@anda.com"
                        autocomplete="username"
                    >

                </div>

            </div>


            <!-- KATA LALUAN -->
            <div class="form-group-custom">

                <label
                    for="passwordInput"
                    class="form-label-custom"
                >
                    Kata Laluan
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-outlined input-icon">
                        lock
                    </span>

                    <input
                        id="passwordInput"
                        type="password"
                        class="custom-input password-input"
                        placeholder="Masukkan kata laluan"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Tunjukkan kata laluan"
                    >
                        <span
                            id="passwordIcon"
                            class="material-symbols-outlined"
                        >
                            visibility
                        </span>
                    </button>

                </div>

            </div>


            <!-- LUPA KATA LALUAN -->
            <div class="forgot-password-wrapper">

                <a
                    href="1.html"
                    class="forgot-password"
                >
                    Lupa Kata Laluan?
                </a>

            </div>


            <!-- BUTANG LOGIN -->
            <button
                id="butangTabBaharu"
                type="submit"
                class="btn btn-login"
            >
                <span>
                    Log Masuk
                </span>

                <span class="material-symbols-outlined">
                    arrow_forward
                </span>

            </button>

        </form>

<div id="btnPasang" class="mt-1">
<i class="bi bi-phone-fill fs-3"></i>
Pasang Aplikasi
</div>


        <!-- BELUM ADA AKAUN -->
        <div class="register-area">

            <p>
                Belum mempunyai akaun?
            </p>

        </div>

    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->
    <footer class="login-footer">

        <div class="support-pill">

            <span class="material-symbols-outlined">
                support_agent
            </span>

            <a href="1.html">
                Hubungi Pengurusan
            </a>

        </div>

    </footer>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    // ==========================================
    // BUTANG LOGIN
    // ==========================================

    const butang1 = document.getElementById('butangTabBaharu');

    butang1.addEventListener('click', function (event) {

        event.preventDefault();

        window.location.href = '1.html';

    });


    // ==========================================
    // TOGGLE PASSWORD
    // ==========================================

    const togglePassword =
        document.getElementById('togglePassword');

    const passwordInput =
        document.getElementById('passwordInput');

    const passwordIcon =
        document.getElementById('passwordIcon');


    togglePassword.addEventListener('click', function () {

        if (passwordInput.type === 'password') {

            passwordInput.type = 'text';

            passwordIcon.textContent = 'visibility_off';

            togglePassword.setAttribute(
                'aria-label',
                'Sembunyikan kata laluan'
            );

        } else {

            passwordInput.type = 'password';

            passwordIcon.textContent = 'visibility';

            togglePassword.setAttribute(
                'aria-label',
                'Tunjukkan kata laluan'
            );

        }

    });
	
	
  let deferredPrompt;
  const btnPasang = document.getElementById('btnPasang');

  // 1. Daftar Service Worker dengan laluan repo yang betul
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/permaicourt1/service-worker.js')
        .then(reg => console.log('Service Worker aktif'))
        .catch(err => console.log('Gagal:', err));
    });
  }

  // 2. Tangkap event sedia untuk dipasang dari pelayar
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); // Halang prompt automatik biasa
    deferredPrompt = e;  // Simpan event untuk digunakan nanti
    btnPasang.style.display = 'block'; // Paparkan butang pasang manual anda

    btnPasang.addEventListener('click', () => {
      btnPasang.style.display = 'none'; // Sorokkan butang selepas ditekan
      deferredPrompt.prompt(); // Paparkan prompt pasang rasmi pelayar
      
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Pengguna bersetuju memasang PWA');
        }
        deferredPrompt = null;
      });
    });
  });
               
</script>

</body>
</html>
